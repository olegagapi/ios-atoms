# Demo app for every component in this repo.
# Generate the Xcode project with:  xcodegen generate   (run from this folder)
name: Catalog
options:
  bundleIdPrefix: dev.iosatoms
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ios-atoms:
    path: ..

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Catalog:
    type: application
    platform: iOS
    sources:
      - App
      - ProgressiveSlider
    dependencies:
      - package: ios-atoms
        product: ProgressiveSlider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.iosatoms.Catalog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CFBundleDisplayName: iOS Atoms
        TARGETED_DEVICE_FAMILY: "1,2"

  # Component tests that need a running app (UIControl only dispatches
  # actions inside a UIApplication). One folder per component.
  CatalogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Catalog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.iosatoms.CatalogTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Catalog:
    build:
      targets:
        Catalog: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CatalogTests
